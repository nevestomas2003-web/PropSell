<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PropSell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: coluna de telemóvel centrada; cabeçalho, conteúdo com scroll, navegação inferior. */
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --ink:#13253A; --muted:#566779; --line:#D8E0E7;
  --accent:#0B7C86; --accent-ink:#FFFFFF; --accent-soft:#DDF1F3;
  --ok:#1C7C47; --ok-soft:#DFF3E7; --warn:#9A5B00; --warn-soft:#FBEBCF; --bad:#B3321F; --bad-soft:#FBE3DE; --neutral-soft:#E8EDF1;
  --font-display:'Sora',system-ui,sans-serif; --font-body:'Nunito Sans',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1620; --surface:#16222E; --ink:#E7EEF4; --muted:#9BABBA; --line:#263646;
  --accent:#43B9C4; --accent-ink:#06222A; --accent-soft:#123A41;
  --ok:#59C98A; --ok-soft:#143524; --warn:#F0B35A; --warn-soft:#3B2A0F; --bad:#F08A78; --bad-soft:#3E1C16; --neutral-soft:#1F2D3A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D1620; --surface:#16222E; --ink:#E7EEF4; --muted:#9BABBA; --line:#263646;
  --accent:#43B9C4; --accent-ink:#06222A; --accent-soft:#123A41;
  --ok:#59C98A; --ok-soft:#143524; --warn:#F0B35A; --warn-soft:#3B2A0F; --bad:#F08A78; --bad-soft:#3E1C16; --neutral-soft:#1F2D3A; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
#shell{height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
@media (min-width:600px){body{padding:16px 0}#shell{height:calc(100% );border:1px solid var(--line);border-radius:28px;box-shadow:0 12px 40px rgba(10,30,50,.18)}}
header.bar{display:flex;align-items:center;gap:8px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--line);min-height:56px}
header.bar h1{font-family:var(--font-display);font-size:18px;margin:0;flex:1;line-height:1.2;font-weight:600}
header.bar .sub{font-size:13px;color:var(--muted);font-weight:400;display:block;margin-top:2px;font-family:var(--font-body)}
main#main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
nav.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:10px 4px;font:600 13px var(--font-body);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;cursor:pointer}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs svg{width:22px;height:22px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:12px 16px;border-radius:12px;font-weight:700;cursor:pointer;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:40px;padding:8px 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
.icon-btn{border:0;background:none;color:var(--ink);width:44px;height:44px;border-radius:12px;display:grid;place-items:center;cursor:pointer}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{font-family:var(--font-display);font-size:15px;margin:0;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:700;font-size:14px}
.field input[type=text],.field textarea,.field select{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;width:100%;min-height:48px}
.field textarea{min-height:110px;resize:vertical}
.field.invalid input,.field.invalid textarea,.field.invalid select{border-color:var(--bad)}
.err{color:var(--bad);font-size:14px;font-weight:600}
.hint{color:var(--muted);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--neutral-soft);color:var(--ink)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.spread{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thumb{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--neutral-soft)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:999px;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:18px;cursor:pointer;line-height:1}
.steps{display:flex;gap:6px}
.steps button{flex:1;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:12px;padding:8px 4px;font:700 13px var(--font-body);min-height:44px;cursor:pointer}
.steps button[aria-current="step"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.ad-card{display:flex;gap:12px;cursor:pointer;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px;color:var(--ink)}
.ad-card .pic{width:76px;height:76px;border-radius:12px;background:var(--neutral-soft);flex:none;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:12px}
.ad-card .pic img{width:100%;height:100%;object-fit:cover}
.ad-card .t{font-weight:700;font-family:var(--font-display);font-size:15px;line-height:1.25}
.ad-card .meta{font-size:13px;color:var(--muted)}
.empty{text-align:center;padding:36px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h2{font-family:var(--font-display);margin:0}
.banner{border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.banner button.x{border:0;background:none;color:inherit;font-weight:700;cursor:pointer;min-height:32px;padding:0 6px}
.feat{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.feat .nm{font-weight:700}
.feat.rej{opacity:.6}
.bar-conf{height:6px;border-radius:6px;background:var(--neutral-soft);overflow:hidden}
.bar-conf i{display:block;height:100%;background:var(--accent)}
.disc{border:1px solid var(--warn);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.disc.done{border-color:var(--line);opacity:.8}
.disc del{color:var(--bad)} .disc ins{color:var(--ok);text-decoration:none;font-weight:700}
.overlay{position:absolute;inset:0;background:rgba(10,20,30,.55);display:grid;place-items:center;z-index:20;padding:20px}
.dialog{background:var(--surface);border-radius:18px;padding:18px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:12px}
.dialog h3{margin:0;font-family:var(--font-display);font-size:17px}
.spinner{width:34px;height:34px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:sp 0.9s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:3s}}
#toasts{position:absolute;left:12px;right:12px;bottom:76px;display:flex;flex-direction:column;gap:8px;z-index:30;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.fab{position:absolute;right:16px;bottom:78px;z-index:10;box-shadow:0 8px 20px rgba(11,124,134,.35);border-radius:16px}
.preview{border:1px dashed var(--line);border-radius:12px;padding:12px;background:var(--bg);white-space:pre-wrap;font-size:14px;max-height:220px;overflow:auto}
.log{font-size:13px;border-bottom:1px solid var(--line);padding:6px 0;display:flex;flex-direction:column;gap:2px}
.test-row{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.checkline{display:flex;gap:10px;align-items:flex-start;font-weight:600}
.checkline input{width:22px;height:22px;margin-top:2px;flex:none}
audio{width:100%}
</style>
</head>

<div id="shell">
  <div id="root" style="display:flex;flex-direction:column;height:100%"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="overlay-host"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* Ligação à IA fora do claude.ai: se window.claude não existir, usa o backend /api/ai.
   Mantém a mesma interface (use('sample') -> s(prompt), s.json(prompt, {images, signal}), s.limits()). */
(function(){
  if (window.claude) return;
  const MAXSIDE = 1024, QUALITY = 0.72;
  async function toPart(blob){
    const url = URL.createObjectURL(blob);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('imagem')); i.src = url; });
      const k = Math.min(1, MAXSIDE / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.naturalWidth*k)); c.height = Math.max(1, Math.round(img.naturalHeight*k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      return { media_type: 'image/jpeg', data: c.toDataURL('image/jpeg', QUALITY).split(',')[1] };
    } finally { URL.revokeObjectURL(url); }
  }
  async function call(prompt, opts, asJson){
    opts = opts || {};
    const images = opts.images && opts.images.length ? await Promise.all(opts.images.map(toPart)) : [];
    let r;
    try {
      r = await fetch('/api/ai', { method:'POST', headers:{'content-type':'application/json'}, signal: opts.signal, body: JSON.stringify({ prompt, images, json: !!asJson }) });
    } catch(e){ if (e && e.name === 'AbortError') throw e; const err = new Error('rede'); err.code = 'network'; throw err; }
    let d = null; try { d = await r.json(); } catch(e){}
    if (!r.ok){ const err = new Error((d && d.message) || ('erro ' + r.status)); err.code = r.status === 429 ? 'rate_limited' : (r.status === 503 ? 'not_granted' : 'network'); throw err; }
    return d.text;
  }
  const s = (prompt, opts) => call(prompt, opts, false);
  s.json = async (prompt, opts) => { const t = await call(prompt, opts, true); return JSON.parse(String(t).trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim()); };
  s.limits = async () => ({ images: true });
  window.claude = { use: async (name) => name === 'sample' ? s : null };
})();
</script>
<script>
'use strict';
/* =====================================================================
   PropSell — protótipo funcional (app móvel). Português de Portugal.
   Estrutura: utilitários → regras (funções puras) → armazenamento → IA → ecrãs → testes.
   ===================================================================== */

/* ---------- Utilitários ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const nowISO = () => new Date().toISOString();
const fmtDate = iso => { try { return new Date(iso).toLocaleString('pt-PT',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); } catch(e){ return iso; } };
const fmtMB = b => (b/1048576).toLocaleString('pt-PT',{minimumFractionDigits:1,maximumFractionDigits:1});
const fmtDur = s => { const m=Math.floor(s/60), r=Math.round(s%60); return m ? `${m} min ${String(r).padStart(2,'0')} s` : `${r} s`; };
const fmtEUR = n => Number(n).toLocaleString('pt-PT',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const MAX_FOTOS = 20, MIN_W = 800, MIN_H = 600, MAX_AUDIO_S = 300, MAX_AUDIO_BYTES = 30*1048576, AUDIO_OK = ['MP3','M4A','WAV','OGG'], LIMIAR = 75, TIMEOUT_MS = 15000;
const STG_MAX_DECORADAS = 20, STG_MAX_TENT = 10, STG_LABEL = 'Imagem decorada virtualmente', STG_ESTILOS = ['Moderno','Clássico','Minimalista'];
const CANAIS = [
  {id:'idealista', nome:'Idealista', tipo:'portal'},
  {id:'imovirtual', nome:'Imovirtual', tipo:'portal'},
  {id:'instagram', nome:'Instagram', tipo:'rede'},
  {id:'facebook', nome:'Facebook', tipo:'rede'},
  {id:'pdf', nome:'PDF (dossiê comercial)', tipo:'pdf'}
];

/* ---------- Regras de negócio (funções puras, também usadas pela verificação) ---------- */
function parseArea(v){ const n = parseFloat(String(v ?? '').replace(',','.').trim()); return Number.isFinite(n) ? n : NaN; }
// RN02 / CA01
function validateForm(f){
  const e = {};
  if (!String(f.tipologia ?? '').trim()) e.tipologia = 'Indique a tipologia (por exemplo, T2).';
  if (!String(f.localizacao ?? '').trim()) e.localizacao = 'Indique a localização (concelho ou freguesia).';
  const a = parseArea(f.area);
  if (!String(f.area ?? '').trim()) e.area = 'Indique a área em m².';
  else if (!(a > 0)) e.area = 'A área tem de ser um número maior que zero.';
  return e;
}
// RN03 — fotografias. info = {formato, bytes, w, h}
function imageProblem(info){
  if (!['JPEG','PNG','HEIC'].includes(info.formato)) {
    if (info.formato === 'DESCONHECIDO') return 'O ficheiro não é uma imagem válida.';
    return `Formato não aceite (${info.formato}). Use JPEG ou PNG.`;
  }
  if (info.w < MIN_W || info.h < MIN_H) return `Resolução demasiado baixa (${info.w}×${info.h}). Mínimo: ${MIN_W}×${MIN_H} px.`;
  return null;
}
// RN03 — áudio. info = {formato, dur}
function audioProblem(info){
  if (!AUDIO_OK.includes(info.formato)) return info.formato === 'DESCONHECIDO' ? 'O ficheiro não é um áudio válido. Use MP3, M4A, WAV ou OGG.' : `Formato de áudio não aceite (${info.formato}). Use MP3, M4A, WAV ou OGG.`;
  if (info.bytes > MAX_AUDIO_BYTES) return `Ficheiro de áudio demasiado grande (${fmtMB(info.bytes)} MB). Máximo: 30 MB.`;
  if (info.dur > MAX_AUDIO_S + 0.5) return `Áudio demasiado longo (${fmtDur(info.dur)}). Máximo: 5 minutos.`;
  return null;
}
// RN04
const visibleFeatures = list => list.filter(f => f.confianca >= LIMIAR);
// RN05
const approved = ad => (ad.caracteristicas||[]).filter(c => c.decisao === 'aprovada');
// Palavras-chave de características físicas (modo local e verificação)
const KEYWORDS = [
  ['varanda', /varand/i], ['terraço', /terra[cç]o/i], ['piscina', /piscin/i], ['garagem', /garag|estacionamento/i],
  ['elevador', /elevador/i], ['jardim', /jardim/i], ['lareira', /lareira/i], ['ar condicionado', /ar condicionado/i],
  ['cozinha equipada', /cozinha (totalmente |toda |completamente )?equipada/i], ['piso em madeira', /piso (em )?madeira|parquet|soalho/i],
  ['roupeiro', /roupeiro|closet/i], ['luz natural', /luz natural|luminos|muita luz|bem iluminad/i], ['arrecadação', /arrecada[cç]/i],
  ['mobilado', /mobilad/i], ['base de duche', /duche/i], ['sala ampla', /sala (ampla|espa[cç]osa)/i], ['vista desafogada', /vista (desafogada|mar|rio)/i]
];
// Modo local — geração por modelo de texto (RN05: só dados existentes)
function localGenerate(ad){
  const tip = String(ad.tipologia||'').trim(), area = parseArea(ad.area);
  const feats = approved(ad).map(c => c.nome);
  const loc = String(ad.localizacao||'').trim();
  let titulo = `Apartamento ${tip} com ${area.toLocaleString('pt-PT')} m²${loc?` em ${loc}`:''}`;
  if (feats.length) titulo += ` — ${feats.slice(0,2).join(' e ')}`;
  titulo = titulo.slice(0,90);
  let d = `Apartamento ${tip} com ${area.toLocaleString('pt-PT')} m² de área${loc?`, localizado em ${loc}`:''}.`;
  if (feats.length) d += ` Características: ${feats.join(', ')}.`;
  const notas = String(ad.notas||'').trim();
  if (notas) d += `\n\n${notas}`;
  if (!ad.fotos.length) d += `\n\nAnúncio sem fotografias.`;
  return { titulo, descricao: d };
}
// Modo local — coerência por palavras-chave
function localCoherence(ad){
  const texto = `${ad.titulo||''}\n${ad.descricao||''}`;
  const notas = ad.notas||'';
  const feats = approved(ad).map(c => c.nome).join(' | ');
  const out = [];
  for (const [nome, re] of KEYWORDS){
    const m = texto.match(re) || notas.match(re);
    if (m && !re.test(feats)) out.push({ id: uid(), afirmacao: nome, motivo: `A afirmação «${nome}» não tem suporte nas características validadas a partir das fotografias.`, trecho: (texto.match(re)||[''])[0], trechoNotas: (notas.match(re)||[''])[0], sugestao: '', decisao: null });
  }
  return out;
}
// Estado da coerência (RN06)
function coherenceOf(ad){
  if (!ad.fotos.length) return 'Não aplicável';
  if (approved(ad).length === 0) return 'Pendente';
  if ((ad.discrepancias||[]).some(d => !d.decisao)) return 'Pendente';
  if (ad.coerenciaVerificada === false || ad.coerenciaVerificada == null) return 'Pendente';
  return 'Validada';
}
// Em falta para Concluído (RN07)
function missingForConcluido(ad){
  const m = [];
  if (!String(ad.titulo||'').trim()) m.push('título');
  if (!String(ad.descricao||'').trim()) m.push('descrição');
  if (!(parseArea(ad.preco) > 0)) m.push('preço');
  if (!String(ad.tipologia||'').trim()) m.push('tipologia');
  if (!(parseArea(ad.area) > 0)) m.push('área');
  if (!String(ad.localizacao||'').trim()) m.push('localização');
  if (!ad.revisado) m.push('confirmação «Revi o anúncio»');
  const c = coherenceOf(ad);
  if (c === 'Não aplicável') m.push('fotografias (sem elas a coerência não se aplica e o anúncio não pode ser exportado)');
  else if (c !== 'Validada') m.push('coerência validada');
  return m;
}
function genSig(ad){ return (ad.fotos||[]).map(f=>f.id).join(',') + '|' + approved(ad).map(c=>c.nome).sort().join(','); }
function computeEstado(ad){ return missingForConcluido(ad).length ? 'Rascunho' : 'Concluído'; }
// FA5 — aceitar a nova versão: substitui o(s) campo(s) escolhido(s), devolve a Rascunho e exige nova confirmação
function applyRegeneracao(ad, nova, alvo){
  ad.versaoAnterior = { titulo: ad.titulo, descricao: ad.descricao, discrepancias: JSON.parse(JSON.stringify(ad.discrepancias||[])), coerenciaVerificada: ad.coerenciaVerificada, sigGeracao: ad.sigGeracao };
  if (alvo.titulo) ad.titulo = nova.titulo;
  if (alvo.descricao) ad.descricao = nova.descricao;
  ad.discrepancias = nova.discrepancias || []; ad.coerenciaVerificada = true; ad.revisado = false;
  ad.estado = computeEstado(ad); ad.sigGeracao = genSig(ad);
}
// RN09 — qualquer edição repete a coerência e exige nova confirmação
function markEdited(ad){
  ad.revisado = false; ad.coerenciaVerificada = false;
  ad.estado = computeEstado(ad);
}
// RN10 — pré-requisitos de exportação
function exportBlockers(ad, canaisSel, legal){
  const b = [];
  if (ad.estado !== 'Concluído' && ad.estado !== 'Publicado') b.push('O anúncio tem de estar Concluído.');
  if (coherenceOf(ad) === 'Pendente') b.push('A coerência está Pendente. Resolva as discrepâncias na etapa Proposta.');
  if (!canaisSel.length) b.push('Escolha pelo menos um canal.');
  const temPortal = canaisSel.some(id => CANAIS.find(c=>c.id===id)?.tipo === 'portal');
  const temRede = canaisSel.some(id => CANAIS.find(c=>c.id===id)?.tipo === 'rede');
  if (temPortal){

async function callAI(tipo, fn){

  let s; try { s = await ensureAI(); } catch(e){ log(tipo, 'falhou', e.detail || e.message); throw e; }
  const ctl = new AbortController();
  let timer;
  const timeout = new Promise((_, rej) => { timer = setTimeout(() => { ctl.abort(); rej(new AIError('timeout', 'Tempo limite de 15 s excedido.')); }, TIMEOUT_MS); });
  try {
    const r = await Promise.race([fn(s, ctl.signal), timeout]);
    log(tipo, 'sucesso', ''); return r;
  } catch(e){
    if (e instanceof AIError){ log(tipo, 'falhou', e.detail || e.message); throw e; }
    const err = new AIError(e && e.code === 'rate_limited' ? 'rede' : (e && e.name === 'AbortError' ? 'timeout' : (e && e.code === 'not_granted' ? 'indisponivel' : 'rede')), (e && (e.message || e.code)) || 'erro desconhecido');
    log(tipo, 'falhou', err.detail); throw err;
  } finally { clearTimeout(timer); void t0; }
}

/* ---------- Ficheiros: leitura real e validação ---------- */
function readBytes(file, n){ return file.slice(0,n).arrayBuffer().then(b => new Uint8Array(b)); }
async function sniffImage(file){
  const b = await readBytes(file, 12);
  if (b[0]===0xFF && b[1]===0xD8 && b[2]===0xFF) return 'JPEG';
  if (b[0]===0x89 && b[1]===0x50 && b[2]===0x4E && b[3]===0x47) return 'PNG';
  if (b[0]===0x47 && b[1]===0x49 && b[2]===0x46 && b[3]===0x38) return 'GIF';
  if (b[0]===0x52 && b[1]===0x49 && b[2]===0x46 && b[3]===0x46 && b[8]===0x57 && b[9]===0x45) return 'WebP';
  if (b[4]===0x66 && b[5]===0x74 && b[6]===0x79 && b[7]===0x70) return 'HEIC';
  if (b[0]===0x42 && b[1]===0x4D) return 'BMP';
  return 'DESCONHECIDO';
}
async function sniffAudio(file){
  const b = await readBytes(file, 12);
  if ((b[0]===0x49 && b[1]===0x44 && b[2]===0x33) || (b[0]===0xFF && (b[1] & 0xE0) === 0xE0)) return 'MP3';
  if (b[0]===0x52 && b[1]===0x49 && b[2]===0x46 && b[3]===0x46) return b[8]===0x57 && b[9]===0x41 ? 'WAV' : 'DESCONHECIDO';
  if (b[0]===0x4F && b[1]===0x67 && b[2]===0x67 && b[3]===0x53) return 'OGG';
  if (b[4]===0x66 && b[5]===0x74 && b[6]===0x79 && b[7]===0x70) return 'M4A';
  if (b[0]===0x66 && b[1]===0x4C && b[2]===0x61 && b[3]===0x43) return 'FLAC';
  return 'DESCONHECIDO';
}
function loadImage(url){ return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('decode')); i.src = url; }); }
function hexHead(file){ return readBytes(file, 8).then(b => [...b].map(x => x.toString(16).padStart(2,'0')).join(' ')).catch(() => '?'); }
// Lê a imagem por vários caminhos (createImageBitmap, depois data URL) e devolve as dimensões e uma função de desenho.
async function decodeImage(file){
  const erros = [];
  if (window.createImageBitmap){
    try { const bm = await createImageBitmap(file); return { w: bm.width, h: bm.height, src: bm, done: () => { try { bm.close(); } catch(e){} } }; }
    catch(e){ erros.push('bitmap: ' + (e && e.message || e)); }
  }
  try {
    const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error || new Error('leitura')); r.readAsDataURL(file); });
    const img = await loadImage(url);
    return { w: img.naturalWidth, h: img.naturalHeight, src: img, done: () => {} };
  } catch(e){ erros.push('img: ' + (e && e.message || e)); }
  const err = new Error(erros.join(' | ')); throw err;
}
async function processImage(file){
  let formato;
  try { formato = await sniffImage(file); } catch(e){ formato = 'DESCONHECIDO'; }
  if (!['JPEG','PNG','HEIC'].includes(formato)){
    const p = imageProblem({formato, bytes:file.size, w:0, h:0});
    return { ok:false, motivo: formato === 'DESCONHECIDO' ? `${p} (${file.size} bytes, tipo «${file.type||'desconhecido'}», cabeçalho ${await hexHead(file)})` : p };
  }
  let dec;
  try { dec = await decodeImage(file); }
  catch(e){ return { ok:false, motivo: formato === 'HEIC' ? 'O formato HEIC não pôde ser lido neste navegador. Use JPEG ou PNG.' : `Não foi possível abrir a imagem neste navegador (${formato}, ${fmtMB(file.size)} MB). Detalhe técnico: ${e.message}` }; }
  try {
    const { w, h } = dec;
    const p = imageProblem({formato, bytes:file.size, w, h}); if (p) return { ok:false, motivo:p };
    const k = Math.min(1, 1280/Math.max(w,h)); const c = document.createElement('canvas'); c.width = Math.round(w*k); c.height = Math.round(h*k);
    c.getContext('2d').drawImage(dec.src, 0, 0, c.width, c.height);
    return { ok:true, foto:{ id:uid(), nome:file.name, w, h, bytes:file.size, data:c.toDataURL('image/jpeg', 0.78) } };
  } catch(e){ return { ok:false, motivo:`Não foi possível preparar a imagem (${e && e.message || e}).` }; }
  finally { dec.done(); }
}
async function processAudio(file){
  const formato = await sniffAudio(file);
  const pre = audioProblem({formato, dur:0, bytes:file.size}); if (pre) return { ok:false, motivo: pre };
  const url = URL.createObjectURL(file);

    const p = audioProblem({formato, dur, bytes:file.size}); if (p) return { ok:false, motivo:p };
    const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
    return { ok:true, audio:{ nome:file.name, dur, data } };
  } catch(e){ return { ok:false, motivo:`Este navegador não consegue ler o áudio (${formato}). Experimente MP3 ou M4A.` }; }
  finally { URL.revokeObjectURL(url); }
}

  settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  notes:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>',
  back:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  plus:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>'
};

/* ---------- Render ---------- */
function chipEstado(e){ return `<span class="chip ${e==='Publicado'?'acc':e==='Concluído'?'ok':'warn'}">${esc(e)}</span>`; }
function chipCoer(c){ if (c == null) return ''; return `<span class="chip ${c==='Validada'?'ok':c==='Pendente'?'warn':''}">Coerência: ${esc(c)}</span>`; }
function render(){
  const main = $('#main'); const keep = main ? main.scrollTop : 0;
  let html = '';
  if (V.name === 'edit') html = screenEdit();
  else if (V.name === 'export') html = screenExport();
  else html = screenTab();
  $('#root').innerHTML = html;
  const m = $('#main'); if (m) m.scrollTop = keep;
  if (V.name === 'edit' && V.step === 3) refreshStep3();
}
function header(title, sub, back){
  return `<header class="bar">${back?`<button class="icon-btn" data-act="back" aria-label="Voltar">${ICON.back}</button>`:''}<h1>${esc(title)}${sub?`<span class="sub">${esc(sub)}</span>`:''}</h1></header>`;
}
function tabsBar(){
  const t = (id, label, ic) => `<button data-act="tab" data-tab="${id}" ${V.tab===id?'aria-current="page"':''}>${ICON[ic]}${label}</button>`;
  return `<nav class="tabs" aria-label="Navegação principal">${t('list','Anúncios','list')}${t('settings','Definições','settings')}${t('notes','Protótipo','notes')}</nav>`;
}
function screenTab(){
  if (V.tab === 'settings') return header('Definições','Estado da IA e registos') + `<main id="main">${settingsBody()}</main>` + tabsBar();
  if (V.tab === 'notes') return header('Notas do protótipo','Hipóteses, limitações e verificação') + `<main id="main">${notesBody()}</main>` + tabsBar();
  const ads = [...S.ads].sort((a,b)=> b.atualizado.localeCompare(a.atualizado));
  const body = ads.length ? ads.map(adCard).join('') : `<div class="empty"><h2>Sem anúncios</h2><div class="hint">Crie o primeiro anúncio com as fotografias e as notas da visita.</div><button class="btn primary" data-act="new">${ICON.plus} Criar Anúncio</button></div>`;
  const offline = !online() ? `<div class="banner warn">Sem ligação à internet. Pode recolher fotografias e notas; os pedidos de IA ficam em fila.</div>` : '';
  const stor = !storageOK ? `<div class="banner bad">Este ambiente não permite guardar dados no dispositivo. Os anúncios perdem-se ao fechar a página.</div>` : '';
  return header('PropSell','Olá, João Silva') + `<main id="main">${offline}${stor}${body}</main>${ads.length?`<button class="btn primary fab" data-act="new" aria-label="Criar Anúncio">${ICON.plus} Criar Anúncio</button>`:''}` + tabsBar();
}
function adCard(a){
  const pic = a.fotos[0] ? `<img src="${a.fotos[0].data}" alt="">` : 'sem foto';
  const t = a.titulo || `${a.tipologia||'Anúncio'}${a.localizacao?` · ${a.localizacao}`:''}${a.area?` · ${a.area} m²`:''}${!a.tipologia&&!a.area&&!a.localizacao?' sem dados':''}`;
  const fila = a.fila ? `<span class="chip warn">Pedido em fila</span>` : '';
  const ja = a.jaPublicado && a.estado !== 'Publicado' ? `<span class="chip">Já publicado antes</span>` : '';
  return `<button class="ad-card" data-act="open" data-id="${a.id}"><div class="pic">${pic}</div><div style="flex:1;min-width:0"><div class="t">${esc(t)}</div><div class="meta">${a.fotos.length} foto${a.fotos.length===1?'':'s'} · ${fmtDate(a.atualizado)}</div><div class="row" style="margin-top:6px">${chipEstado(a.estado)}${chipCoer(a.gerado?coherenceOf(a):null)}${fila}${ja}</div></div></button>`;
}

/* ----- Ecrã de edição (3 etapas) ----- */
function screenEdit(){
  const ad = curAd(); if (!ad){ V.name='list'; return screenTab(); }
  const titulo = ad.titulo ? ad.titulo : 'Novo anúncio';
  const s = (n, label) => `<button data-act="step" data-n="${n}" ${V.step===n?'aria-current="step"':''}>${n}. ${label}</button>`;
  let body = '';
  if (V.step === 1) body = step1(ad); else if (V.step === 2) body = step2(ad); else body = step3(ad);
  return header(titulo, `${ad.estado}${ad.modoLocal?' · modo local':''}`, true) + `<main id="main"><div class="steps" role="tablist">${s(1,'Dados')}${s(2,'Características')}${s(3,'Proposta')}</div>${body}</main>`;
}
function errorsPanel(){
  const list = V.fileErrors || []; if (!list.length) return '';
  return `<div class="banner bad" role="alert"><div><strong>Ficheiros recusados</strong><ul style="margin:6px 0 0;padding-left:18px">${list.map(e=>`<li><strong>${esc(e.nome)}</strong>: ${esc(e.motivo)}</li>`).join('')}</ul></div><button class="x" data-act="close-errors">Fechar</button></div>`;
}
function step1(ad){
  const er = V.formErr || {};
  const off = !online() ? `<div class="banner warn">Sem ligação à internet. A recolha continua a funcionar; ao gerar, o pedido fica em fila.</div>` : '';
  const fila = ad.fila ? `<div class="banner info">Pedido de IA em fila. Será processado automaticamente quando a ligação regressar.</div>` : '';
  const erro = ad.erro ? errorBox(ad) : '';
  return `${off}${fila}${erro}
  <div class="card">
    <div class="field ${er.tipologia?'invalid':''}"><label for="f-tip">Tipologia</label><input id="f-tip" type="text" data-bind="tipologia" value="${esc(ad.tipologia)}" placeholder="Ex.: T2" autocomplete="off">${er.tipologia?`<div class="err">${esc(er.tipologia)}</div>`:''}</div>
    <div class="field ${er.localizacao?'invalid':''}"><label for="f-loc">Localização</label><input id="f-loc" type="text" data-bind="localizacao" value="${esc(ad.localizacao)}" placeholder="Ex.: Alvalade, Lisboa" autocomplete="off"><div class="hint">Concelho ou freguesia. A morada exata nunca é enviada à IA.</div>${er.localizacao?`<div class="err">${esc(er.localizacao)}</div>`:''}</div>
    <div class="field ${er.area?'invalid':''}"><label for="f-area">Área (m²)</label><input id="f-area" type="text" inputmode="decimal" data-bind="area" value="${esc(ad.area)}" placeholder="Ex.: 78" autocomplete="off">${er.area?`<div class="err">${esc(er.area)}</div>`:''}</div>
  </div>
  <div class="card">
    <div class="row spread"><h2>Fotografias</h2><span class="chip">${ad.fotos.length}/${MAX_FOTOS}</span></div>
    <div class="hint">JPEG ou PNG (e HEIC, se o telemóvel o permitir), com mínimo de 800×600 px. As fotografias são reduzidas automaticamente. Evite fotografar pessoas: os rostos não são desfocados nesta versão.</div>
    <div class="grid2"><label class="btn" for="in-cam">Tirar foto</label><label class="btn" for="in-gal">Escolher da galeria</label></div>
    <input id="in-cam" class="sr" type="file" accept="image/*" capture="environment">
    <input id="in-gal" class="sr" type="file" accept="image/*,.jpg,.jpeg,.png,.heic,.gif" multiple>
    ${errorsPanel()}
    ${ad.fotos.length?`<div class="thumbs">${ad.fotos.map(f=>`<div class="thumb"><img src="${f.data}" alt="${esc(f.nome)}"><button data-act="rm-foto" data-id="${f.id}" aria-label="Remover ${esc(f.nome)}">×</button></div>`).join('')}</div>`:''}
  </div>
  <div class="card">
    <h2>Notas da visita</h2>
    <div class="field"><div class="row spread"><label for="f-notas">Notas</label><button class="btn small" data-act="ditar">Ditar nota</button></div><textarea id="f-notas" data-bind="notas" placeholder="Escreva ou dite o que reparou no imóvel…">${esc(ad.notas)}</textarea></div>
    <div class="hint">Para ditar, toque no microfone do teclado do telemóvel. Moradas exatas são substituídas por uma referência genérica antes de qualquer envio à IA.</div>
    <div class="row spread"><strong style="font-size:14px">Áudio anexo (MP3, M4A, WAV ou OGG, até 5 min)</strong><label class="btn small" for="in-aud">Carregar áudio</label></div>
    <input id="in-aud" class="sr" type="file" accept="audio/*,video/mp4,.m4a,.mp3,.wav,.ogg,.flac">
    ${V.audioErr?`<div class="banner bad" role="alert"><div><strong>${esc(V.audioErr.nome)}</strong>: ${esc(V.audioErr.motivo)}</div><button class="x" data-act="close-audio-err">Fechar</button></div>`:''}
    ${ad.audio?`<div class="field"><div class="row spread"><span class="hint">${esc(ad.audio.nome)} · ${fmtDur(ad.audio.dur)}</span><button class="btn small" data-act="rm-audio">Remover</button></div><audio controls src="${ad.audio.data}"></audio></div>`:''}
    <div class="hint">A transcrição automática de ficheiros de áudio não está disponível neste ambiente: o áudio fica anexado ao anúncio. Para passar a voz a texto, dite com o teclado.</div>
  </div>
  <button class="btn primary block" data-act="gerar">Gerar anúncio</button>
  <button class="btn danger block" data-act="del">Apagar anúncio</button>`;
}
function errorBox(ad){
  const e = ad.erro; if (!e) return '';
  if (ad.regenPend && !e.passo.startsWith('Extração')) ad.regenPend = null;
  return `<div class="banner bad" role="alert"><div><strong>${esc(e.passo)}</strong><div>${esc(e.msg)}</div>${e.detalhe?`<div class="hint" style="color:inherit;opacity:.85">Erro: ${esc(e.detalhe)}</div>`:''}<div class="hint" style="color:inherit">O anúncio está guardado como Rascunho; nada se perdeu.</div><div class="row" style="margin-top:8px"><button class="btn small" data-act="retry">Tentar de novo</button><button class="btn small" data-act="manual">Escrever manualmente</button>${e.passo.startsWith('Extração')?`<button class="btn small" data-act="only-notes">Continuar apenas com as notas</button>`:''}</div></div><button class="x" data-act="close-erro">Fechar</button></div>`;
}
function step2(ad){
  if (!ad.gerado && !ad.caracteristicas.length && !ad.extraido){
    return `<div class="card"><h2>Características</h2><div class="hint">Ainda não há características. Volte à etapa Dados e toque em «Gerar anúncio», ou adicione características à mão.</div></div>${addFeatCard()}`;
  }
  const vis = ad.caracteristicas;
  const aviso = ad.extraido && !vis.some(c=>c.origem==='ia') ? `<div class="banner warn">Confiança visual insuficiente: nenhuma característica atingiu ${LIMIAR}%. Pode preencher à mão ou substituir as fotografias.</div>` : '';
  const ocultas = ad.ocultas ? `<div class="hint">${ad.ocultas} sugest${ad.ocultas===1?'ão':'ões'} abaixo de ${LIMIAR}% de confiança ${ad.ocultas===1?'foi ocultada':'foram ocultadas'}.</div>` : '';
  const erro = ad.erro ? errorBox(ad) : '';
  const cards = vis.map(c => `<div class="feat ${c.decisao==='rejeitada'?'rej':''}" data-fid="${c.id}">
    <div class="row spread"><span class="nm">${esc(c.nome)}</span><span class="chip ${c.decisao==='aprovada'?'ok':c.decisao==='rejeitada'?'bad':''}">${c.decisao==='aprovada'?'Aprovada':c.decisao==='rejeitada'?'Rejeitada':'Por decidir'}</span></div>
    ${c.origem==='ia'?`<div class="row" style="gap:8px"><div class="bar-conf" style="flex:1"><i style="width:${c.confianca}%"></i></div><span class="hint">${c.confianca}%${c.foto?` · foto ${c.foto}`:''}</span></div>`:`<div class="hint">Acrescentada por si</div>`}
    <div class="row"><button class="btn small" data-act="f-ok" data-id="${c.id}">Aprovar</button><button class="btn small" data-act="f-edit" data-id="${c.id}">Editar</button><button class="btn small danger" data-act="f-no" data-id="${c.id}">Rejeitar</button></div></div>`).join('');
  const pend = vis.filter(c=>!c.decisao).length;
  const conf = (ad.confNotas === 'ok') ? `<div class="card" id="conf-card"><div class="row spread"><h2>Conferência das notas com as fotografias</h2>${(ad.discrepancias||[]).some(d=>!d.decisao)?'<span class="chip warn">Por resolver</span>':'<span class="chip ok">Resolvida</span>'}</div>
    <div class="hint">${(ad.discrepancias||[]).length ? 'Estas afirmações das suas notas não batem com o que as fotografias mostram. Decida cada uma antes de gerar o texto.' : 'As suas notas batem certo com as fotografias.'}</div>${discCards(ad)}
    <div class="field"><label for="s2-notas">Notas da visita</label><textarea id="s2-notas" data-bind="notas" style="min-height:90px">${esc(ad.notas)}</textarea></div>
    <div class="row"><button class="btn small" data-act="conf-run">Conferir de novo</button><button class="btn small" data-act="add-foto">Adicionar foto</button></div></div>` : '';
  const abrir = (ad.discrepancias||[]).some(d=>!d.decisao) && ad.confNotas==='ok';
  const rotulo = abrir ? 'Resolva as afirmações por resolver para continuar' : (ad.fotos.length && String(ad.notas||'').trim() && approved(ad).length && ad.confNotas!=='ok' ? 'Conferir as notas e continuar' : 'Gerar a proposta');
  return `${erro}${aviso}<div class="card"><h2>Características sugeridas</h2><div class="hint">Só aparecem sugestões com ${LIMIAR}% ou mais. Só as aprovadas entram no texto e na exportação.</div>${ocultas}${cards || '<div class="hint">Sem características por mostrar.</div>'}</div>${addFeatCard()}${conf}
  <button class="btn primary block" data-act="to-proposta" ${abrir?'disabled':''}>${rotulo}${pend?` (${pend} por decidir serão ignoradas)`:''}</button>`;
}
const addFeatCard = () => `<div class="card"><h2>Acrescentar característica</h2><div class="field"><label class="sr" for="f-new">Nova característica</label><input id="f-new" type="text" placeholder="Ex.: piso em madeira" autocomplete="off"></div><button class="btn" data-act="f-add">Acrescentar</button></div>`;
function step3(ad){
  const erro = ad.erro ? errorBox(ad) : '';
  return `${erro}
  <div class="card">
    <div class="field"><label for="p-tit">Título</label><input id="p-tit" type="text" data-bind="titulo" data-edit="1" value="${esc(ad.titulo)}"></div>
    <div class="field"><label for="p-desc">Descrição</label><textarea id="p-desc" data-bind="descricao" data-edit="1" style="min-height:190px">${esc(ad.descricao)}</textarea></div>
    <div class="field"><label for="p-preco">Preço (€)</label><input id="p-preco" type="text" inputmode="numeric" data-bind="preco" data-price="1" value="${esc(ad.preco)}" placeholder="Indique o preço">
      ${ad.precoNota?`<div class="hint"><strong>Estimativa de apoio, a confirmar pelo agente.</strong> ${esc(ad.precoNota)}</div>`:'<div class="hint">O preço é decidido pelo agente.</div>'}</div>
  </div>
  <div class="card"><div class="field"><label for="p-notas">Notas da visita</label><textarea id="p-notas" data-bind="notas" style="min-height:90px">${esc(ad.notas)}</textarea></div><div class="hint">A verificação de coerência parte destas notas e do texto, e confronta-os com as fotografias. Se as alterar, a coerência volta a Pendente.</div></div>
  <div id="regen"></div>
  <div id="coh"></div>
  <div id="stg"></div>
  <div id="savebox"></div>`;
}
function discCards(ad){
  return (ad.discrepancias||[]).map(d => `<div class="disc ${d.decisao?'done':''}">
    <div class="row spread"><strong>${esc(d.afirmacao)}</strong>${d.decisao?`<span class="chip ${d.decisao==='descartada'?'warn':'ok'}">${d.decisao==='mantida'?'Alterações mantidas':d.decisao==='alterada'?'Alterada por si':'Descartada (assumida por si)'}</span>`:'<span class="chip warn">Por resolver</span>'}</div>
    <div class="hint">${esc(d.motivo)}</div>
    ${d.trechoNotas?`<div class="hint">Nas suas notas: <del>${esc(d.trechoNotas)}</del> <ins>${d.sugestao?esc(d.sugestao):'(remover)'}</ins></div>`:''}
    ${d.trecho?`<div class="hint">No texto: <del>${esc(d.trecho)}</del> <ins>${d.sugestao?esc(d.sugestao):'(remover)'}</ins></div>`:''}
    ${!d.trecho && !d.trechoNotas?'<div class="hint">Não foi possível localizar o excerto: use «Alterar» para o corrigir à mão.</div>':''}
    ${d.decisao?`<div class="row"><button class="btn small" data-act="d-reopen" data-id="${d.id}">Alterar decisão</button></div>`:(d.editando?`<div class="field"><label for="de-${d.id}">Substituir por (deixe vazio para remover)</label><input id="de-${d.id}" type="text" data-dedit="${d.id}" value="${esc(d.edicao ?? d.sugestao ?? '')}" autocomplete="off"></div><div class="row"><button class="btn small primary" data-act="d-apply" data-id="${d.id}">Aplicar</button><button class="btn small" data-act="d-cancel" data-id="${d.id}">Cancelar</button><button class="btn small" data-act="d-drop" data-id="${d.id}">Descartar</button></div>`
      : d.manual ? `<div class="hint">Corrija o texto no campo de notas indicado e confirme.</div><div class="row"><button class="btn small primary" data-act="d-done" data-id="${d.id}">Já corrigi</button><button class="btn small" data-act="d-cancel" data-id="${d.id}">Cancelar</button><button class="btn small" data-act="d-drop" data-id="${d.id}">Descartar</button></div>`
      : `<div class="row"><button class="btn small" data-act="d-keep" data-id="${d.id}" ${(d.trecho||d.trechoNotas)?'':'disabled'}>Manter alterações</button><button class="btn small" data-act="d-edit" data-id="${d.id}">Alterar</button><button class="btn small" data-act="d-drop" data-id="${d.id}">Descartar</button></div>`)}
  </div>`).join('');
}

function refreshStaging(){
  const host = $('#stg'); const ad = curAd(); if (!host || !ad) return;
  V.stg = V.stg || { fotoId:null, estilo:'Moderno', extra:'', preview:null, busy:false };
  const g = V.stg; if (!ad.fotos.find(f => f.id === g.fotoId)) g.fotoId = ad.fotos[0] ? ad.fotos[0].id : null;
  const lim = canStage(ad);
  const decs = (ad.decoradas||[]).map(d => `<div class="thumb" title="${esc(d.estilo)}"><img src="${d.data}" alt="Imagem decorada virtualmente (${esc(d.estilo)})"><button data-act="stg-rm" data-id="${d.id}" aria-label="Remover imagem decorada">×</button></div>`).join('');
  const pick = ad.fotos.map(f => `<button class="thumb" data-act="stg-pick" data-id="${f.id}" style="border:3px solid ${f.id===g.fotoId?'var(--accent)':'transparent'};padding:0;cursor:pointer" aria-label="Escolher ${esc(f.nome)}" aria-pressed="${f.id===g.fotoId}"><img src="${f.data}" alt=""></button>`).join('');
  const prev = g.preview ? `<div class="field"><strong>Pré-visualização (${esc(g.preview.estilo)})</strong><img src="${g.preview.data}" alt="Pré-visualização do Virtual Staging" style="width:100%;border-radius:12px">${g.preview.modoLocal?'<div class="hint">Modo local: peças genéricas, porque a IA não respondeu.</div>':''}<div class="row"><button class="btn small primary" data-act="stg-ok">Aprovar</button><button class="btn small" data-act="stg-no">Descartar</button></div></div>` : '';
  host.innerHTML = `<div class="card"><div class="row spread"><h2>Virtual Staging (opcional)</h2><span class="chip">${ad.stagingTentativas||0}/${STG_MAX_TENT} tentativas</span></div>
    <div class="hint">A IA indica onde há espaço livre e a app desenha o mobiliário no estilo escolhido. É uma pré-visualização esquemática, não uma fotografia gerada. Toda a imagem decorada fica identificada como «${STG_LABEL}» e assim é exportada.</div>
    ${ad.fotos.length?`<div class="thumbs">${pick}</div>
    <div class="field"><label for="stg-estilo">Estilo</label><select id="stg-estilo" data-stg="estilo">${STG_ESTILOS.map(e=>`<option ${e===g.estilo?'selected':''}>${e}</option>`).join('')}</select></div>
    <div class="field"><label for="stg-extra">Instruções adicionais (opcional)</label><input id="stg-extra" type="text" data-stg="extra" value="${esc(g.extra)}" placeholder="Ex.: sofá cinzento, muita planta" autocomplete="off"></div>
    ${lim.ok?'':`<div class="banner warn">${esc(lim.motivo)}</div>`}
    ${g.erro?`<div class="banner bad" role="alert"><div>${esc(g.erro)}</div></div>`:''}
    <button class="btn primary block" data-act="stg-gerar" ${lim.ok && !g.busy && !g.preview?'':'disabled'}>${g.busy?'A decorar…':'Gerar decoração'}</button>

async function gerarStaging(ad){

  g.erro = null; g.descartada = null; g.busy = true; refreshStaging(); showLoading('A decorar a divisão…');
  let plan, modoLocal = false;
  try { plan = await aiStaging(foto, g.estilo, g.extra); }

/* ---------- Ações ---------- */
function go(name, extra){ Object.assign(V, {name}, extra||{}); render(); }
function openAd(id){ const ad = getAd(id); V.formErr = null; V.fileErrors = []; V.audioErr = null; go('edit', {adId:id, step: ad.gerado ? 3 : (ad.extraido ? 2 : 1)}); }
function ensureValidStep(ad){ if (V.step === 3 && !ad.titulo && !ad.descricao) V.step = 2; }

async function addFotos(files){
  const ad = curAd(); if (!ad) return;
  const erros = [];
  let added = 0;
  for (const f of files){
    if (ad.fotos.length >= MAX_FOTOS){ erros.push({nome:f.name, motivo:`Limite de ${MAX_FOTOS} fotografias atingido.`}); continue; }
    const r = await processImage(f);
    if (r.ok){ ad.fotos.push(r.foto); added++; } else erros.push({nome:f.name, motivo:r.motivo});
  }
  if (added){ ad.confNotas = null; ad.coerenciaVerificada = false; if (ad.gerado) markEdited(ad); touch(ad); }
  V.fileErrors = erros; render();
  if (added) toast(`${added} fotografia${added===1?'':'s'} adicionada${added===1?'':'s'}.`);
}
async function addAudio(file){
  const ad = curAd(); if (!ad) return;
  const r = await processAudio(file);
  if (r.ok){ ad.audio = r.audio; V.audioErr = null; touch(ad); toast('Nota de voz anexada.'); } else V.audioErr = {nome:file.name, motivo:r.motivo};
  render();
}
async function gerar(){
  const ad = curAd();
  V.formErr = validateForm(ad);
  if (Object.keys(V.formErr).length){ render(); const el = $('.field.invalid input'); if (el) el.focus(); return; }
  ad.tipologia = ad.tipologia.trim();
  ad.localizacao = sanitizeNotes(ad.localizacao).texto.trim();
  const sn = sanitizeNotes(ad.notas);
  if (sn.alterado){ ad.notas = sn.texto; toast('A morada exata foi substituída por «[zona omitida]». Indique a freguesia, se quiser.'); }
  ad.erro = null; touch(ad);
  if (!ad.fotos.length){
    const ok = await dialog({title:'Sem fotografias', text:'Sem fotografias, a descrição é genérica, só com os dados quantitativos. O anúncio fica em Rascunho e não pode ser exportado até acrescentar fotografias.', ok:'Continuar sem fotografias', cancel:'Adicionar fotografias'});
    if (!ok) return;
    ad.caracteristicas = []; ad.ocultas = 0; ad.extraido = false; ad.discrepancias = [];
    const g = localGenerate(ad); Object.assign(ad, g); ad.preco = ad.preco || ''; ad.precoNota = ''; ad.gerado = true; ad.modoLocal = false; ad.revisado = false; ad.coerenciaVerificada = true;
    ad.estado = computeEstado(ad); touch(ad); V.step = 3; render(); return;
  }
  await runExtraction(ad);
}
async function runExtraction(ad){
  if (!online()){ ad.fila = true; touch(ad); render(); toast('Sem ligação: pedido em fila.'); return; }
  ad.fila = false; showLoading('A analisar fotografias…');
  try {
    const feats = await aiExtract(ad);
    applyFeatures(ad, feats);
    ad.erro = null; ad.modoLocal = false; touch(ad); hideLoading(); V.step = 2; render();
  } catch(e){
    hideLoading(); ad.erro = { passo:'Extração de características', msg: errMsg(e), detalhe: e.detail }; ad.estado = 'Rascunho'; touch(ad); render();
  }
}
function applyFeatures(ad, feats){
  const vis = visibleFeatures(feats);
  ad.ocultas = feats.length - vis.length; ad.extraido = true; ad.gerado = ad.gerado || false;
  ad.caracteristicas = ad.caracteristicas.filter(c => c.origem === 'manual').concat(vis.map(f => ({ id: uid(), nome: f.nome, confianca: Math.round(f.confianca), foto: f.foto, origem:'ia', decisao:null })));
}
async function runGenerate(ad){
  ad.erro = null;
  if (!online()){ ad.fila = 'gerar'; touch(ad); render(); toast('Sem ligação: pedido em fila.'); return; }
  if (ad.regenPend){ const info = ad.regenPend; ad.regenPend = null; await gerarNova(ad, info.instrucoes, info.alvo); return; }
  showLoading('A gerar texto…');
  try {
    const g = await aiGenerate(ad);
    ad.versaoAnterior = null; Object.assign(ad, g); ad.gerado = true; ad.modoLocal = false; ad.sigGeracao = genSig(ad);
  } catch(e){
    hideLoading(); ad.erro = { passo:'Geração do anúncio', msg: errMsg(e), detalhe: e.detail }; ad.estado = 'Rascunho'; touch(ad); V.step = 2; render(); return;
  }
  setLoading('A validar coerência…');
  const assumidas = new Set((ad.discrepancias||[]).filter(d => d.decisao === 'descartada').map(d => d.afirmacao.toLowerCase()));
  try { ad.discrepancias = await aiCoherence(ad); ad.coerenciaVerificada = true; }
  catch(e){ ad.discrepancias = localCoherence(ad); ad.coerenciaVerificada = true; toast('Coerência verificada em modo local: a IA não respondeu.'); }
  ad.discrepancias.forEach(d => { if (assumidas.has(d.afirmacao.toLowerCase())) d.decisao = 'descartada'; });
  ad.revisado = false; ad.estado = computeEstado(ad); ad.confNotas = null; ad.sigGeracao = genSig(ad); touch(ad); hideLoading(); V.step = 3; render();
}
async function gerarNova(ad, instrucoes, alvo){
  const r = V.regen; r.erro = null; r.nova = null; r.descartada = null;
  showLoading('A gerar nova versão…');
  let g;
  try { g = await aiGenerate(ad, instrucoes); }
  catch(e){ hideLoading(); r.erro = `${errMsg(e)} O texto atual mantém-se.`; V.step = 3; render(); return; }
  setLoading('A validar coerência da nova versão…');
  const tmp = Object.assign({}, ad, { titulo: alvo.titulo ? g.titulo : ad.titulo, descricao: alvo.descricao ? g.descricao : ad.descricao });
  const assumidas = new Set((ad.discrepancias||[]).filter(d => d.decisao === 'descartada').map(d => d.afirmacao.toLowerCase()));
  let disc; try { disc = await aiCoherence(tmp); } catch(e){ disc = localCoherence(tmp); }
  disc.forEach(d => { if (assumidas.has(d.afirmacao.toLowerCase())) d.decisao = 'descartada'; });
  r.nova = { titulo: g.titulo, descricao: g.descricao, discrepancias: disc, alvo: Object.assign({}, alvo), instrucoes };
  hideLoading(); V.step = 3; render();
}
async function regenerar(ad){
  const r = V.regen; const alvo = r.alvo || {titulo:true, descricao:true};
  if (!alvo.titulo && !alvo.descricao){ r.erro = 'Escolha o que regenerar: título, descrição ou ambos.'; refreshRegen(); return; }
  if (!online()){ r.erro = 'Falha ao contactar o servidor. O texto atual mantém-se.'; refreshRegen(); return; }
  if (ad.fotos.length && ad.sigGeracao && ad.sigGeracao !== genSig(ad)){
    ad.regenPend = { instrucoes: r.instr || '', alvo: Object.assign({}, alvo) };
    toast('As fotografias ou as características mudaram: a extração corre primeiro.'); await runExtraction(ad); return;
  }
  await gerarNova(ad, r.instr || '', alvo);
}
function manualGenerate(ad){

function applyDisc(ad, d, novo){
  const before = { titulo: ad.titulo, descricao: ad.descricao, notas: ad.notas };
  applyReplace(ad, d.trecho, novo); applyReplaceNotes(ad, d.trechoNotas, novo);

function applyReplaceNotes(ad, trecho, sugestao){
  if (!trecho) return;
  const re = new RegExp(trecho.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'i');
  ad.notas = String(ad.notas||'').replace(re, () => sugestao || '').replace(/[ \t]{2,}/g,' ').replace(/\s+([.,;])/g,'$1').replace(/\b(com|e|ou|de|em)\s+e\b/gi,(m,x)=>x).replace(/,\s*,/g,',').replace(/\be\s*([.,;])/g,'$1').replace(/\bcom\s*([.,;])/gi,'$1');
}
function applyReplace(ad, trecho, sugestao){
  if (!trecho) return;
  const re = new RegExp(trecho.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'i');
  const fix = s => String(s||'').replace(re, () => sugestao || '').replace(/\s{2,}/g,' ').replace(/\s+([.,;])/g,'$1').replace(/^[\s,;]+/,'').trim();
  const tidy = x => x.replace(/[ \t]{2,}/g,' ').replace(/\s+([.,;])/g,'$1').replace(/\b(com|e|ou|de|em|,)\s+e\b/gi,(m,a)=>a).replace(/,\s*,/g,',').replace(/\be\s*([.,;])/g,'$1').replace(/\bcom\s*([.,;])/gi,'$1').replace(/^\s*e\s+/i,'');
  ad.titulo = fix(ad.titulo) || ad.titulo; ad.descricao = tidy(String(ad.descricao||'').replace(re, () => sugestao || ''));
}
async function conferirNotas(ad){
  showLoading('A conferir as notas com as fotografias…');
  const assumidas = new Set((ad.discrepancias||[]).filter(d => d.decisao === 'descartada').map(d => d.afirmacao.toLowerCase()));
  const antes = { titulo: ad.titulo, descricao: ad.descricao }; ad.titulo = ''; ad.descricao = '';
  try { if (!online()) throw new AIError('rede','offline'); ad.discrepancias = await aiCoherence(ad); }
  catch(e){ ad.discrepancias = localCoherence(ad); toast('Conferência em modo local: a IA não respondeu.'); }
  ad.titulo = antes.titulo; ad.descricao = antes.descricao;
  ad.discrepancias.forEach(d => { if (assumidas.has(d.afirmacao.toLowerCase())) d.decisao = 'descartada'; });
  ad.confNotas = 'ok'; touch(ad); hideLoading();
}
async function conferirEGerar(ad){

  if (precisa && ad.confNotas !== 'ok'){
    await conferirNotas(ad);

  }

  await runGenerate(ad);
}
async function runGenerateOrLocal(ad){

  await runGenerate(ad);
}
async function guardar(ad){
  if (!ad.coerenciaVerificada && ad.fotos.length){ await runCoherence(ad); }
  const falta = missingForConcluido(ad);
  if (!(ad.estado === 'Publicado' && !falta.length)) ad.estado = falta.length ? 'Rascunho' : 'Concluído';

async function saveFile(filename, data){
  let dl = null; try { dl = window.claude && await window.claude.use('downloads'); } catch(e){}
  if (!dl){ // fora do claude.ai: descarga normal do navegador
    try { const blob = data instanceof Blob ? data : new Blob([data]); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000); return true; }
    catch(e){ toast('Não foi possível descarregar o ficheiro neste ambiente.'); return false; }
  }
  try { await dl.save({filename, data}); return true; }
  catch(e){ if (e && e.code === 'declined') toast('Descarga cancelada.'); else toast('Não foi possível guardar o ficheiro.'); return false; }
}
async function exportImages(ad){

}
async function exportPDF(ad){

  doc.text(P(`${ad.tipologia} · ${parseArea(ad.area).toLocaleString('pt-PT')} m²${ad.localizacao?` · ${ad.localizacao}`:''}${preco?` · ${preco}`:''}`), M, y); y += 8;
  const dl = doc.splitTextToSize(P(ad.descricao), W-2*M); dl.forEach(line => { need(6); doc.text(line, M, y); y += 5.5; }); y += 4;
  const fe = approved(ad).map(c=>c.nome); if (fe.length){ need(12); doc.setFont('helvetica','bold'); doc.text('Características', M, y); y += 6; doc.setFont('helvetica','normal'); doc.splitTextToSize(P(fe.join(', ')), W-2*M).forEach(l=>{ need(6); doc.text(l, M, y); y += 5.5; }); y += 4; }
  for (const f of ad.fotos){ const w = W-2*M, h = w * (f.h/f.w); const hh = Math.min(h, 120); need(hh+6); try { doc.addImage(f.data, 'JPEG', M, y, hh===h ? w : hh*(f.w/f.h), hh); } catch(e){} y += hh + 6; }
  for (const d of (ad.decoradas||[])){ const im = await loadImage(d.data); const w = W-2*M, h = w * (im.naturalHeight/im.naturalWidth); const hh = Math.min(h, 120); need(hh+12); doc.setFontSize(9); doc.text(P('Imagem decorada virtualmente'), M, y+3); y += 6; try { doc.addImage(d.data, 'JPEG', M, y, hh===h ? w : hh*(im.naturalWidth/im.naturalHeight), hh); } catch(e){} y += hh + 6; }
  doc.setFontSize(8); doc.text(P('Gerado pela PropSell. Conteúdo revisto pelo agente.'), M, 292);
  const ok = await saveFile(`propsell-${(ad.tipologia||'anuncio').toLowerCase()}.pdf`, doc.output('arraybuffer'));
  if (ok){ ad.exportacoes.push({data:nowISO(), canal:'PDF (dossiê comercial)', resultado:'PDF gerado e guardado'}); V.exp.pdfOk = true; touch(ad); toast('PDF guardado. O estado do anúncio não muda.'); render(); }
}

/* ---------- Verificação CA01–CA13 ---------- */
async function runTests(){
  const R = [];
  const add = (id, d, ok, n, manual) => R.push({id, d, r: manual ? 'Por validar manualmente' : (ok ? 'Passou' : 'Falhou'), n});
  const fx = (o) => Object.assign(newAd(), {tipologia:'T2', localizacao:'Lisboa', area:'78', fotos:[{id:'1',w:1600,h:1200,data:'x',nome:'a.jpg'}], gerado:true, titulo:'T', descricao:'D', preco:'300000', ...o});
  const feat = (nome, decisao='aprovada') => ({id:uid(), nome, confianca:90, origem:'ia', decisao});
  // CA01
  { const L='Lisboa'; const a = validateForm({tipologia:'', localizacao:L, area:'78'}), b = validateForm({tipologia:'T2', localizacao:L, area:''}), c = validateForm({tipologia:'T2', localizacao:L, area:'-5'}), d = validateForm({tipologia:'qualquer coisa', localizacao:L, area:'78'}), e = validateForm({tipologia:'T2', localizacao:'', area:'78'});
    add('CA01','Tipologia, localização ou área em falta/inválida bloqueiam; texto livre é aceite.', a.tipologia && b.area && c.area && e.localizacao && !Object.keys(d).length); }
  // CA02
  { const p1 = imageProblem({formato:'GIF',bytes:1000,w:1200,h:900}), p2 = imageProblem({formato:'JPEG',bytes:20*1048576,w:4000,h:3000}) === null ? 'foto grande aceite' : 'ERRO', p3 = imageProblem({formato:'PNG',bytes:1000,w:400,h:300}), p4 = imageProblem({formato:'DESCONHECIDO',bytes:50,w:0,h:0}), ok = imageProblem({formato:'JPEG',bytes:1000,w:1600,h:1200});
    const a1 = audioProblem({formato:'FLAC',dur:5,bytes:1000}), a2 = audioProblem({formato:'MP3',dur:330,bytes:1000}), a3 = audioProblem({formato:'M4A',dur:136,bytes:1000});
    add('CA02','Fotografias e áudios inválidos são recusados com o motivo; os válidos (incluindo fotos grandes e M4A) passam.', p1&&p2==='foto grande aceite'&&p3&&p4&&!ok&&a1&&a2&&!a3, [p1,p2,p3,p4,a1,a2].join(' | ')); }
  // CA03
  { const v = visibleFeatures([{nome:'a',confianca:92},{nome:'b',confianca:74},{nome:'c',confianca:75}]);
    add('CA03','Só aparecem características com 75% ou mais.', v.length===2 && v.every(x=>x.confianca>=75), 'A extração real depende da IA: confirme com fotografias reais.'); R[R.length-1].r = R[R.length-1].r === 'Passou' ? 'Passou' : 'Falhou'; }
  // CA04
  { const a = fx({caracteristicas:[feat('piso em madeira'), feat('piscina','rejeitada')], notas:''}); const g = localGenerate(a);
    add('CA04','O texto só refere características aprovadas (rejeitadas não aparecem).', /piso em madeira/.test(g.descricao) && !/piscina/.test(g.descricao), 'Com a IA real, valide manualmente que o texto não acrescenta nada.'); }
  // CA05
  { const a = fx({caracteristicas:[feat('luz natural')], notas:'T2 com varanda e cozinha equipada', descricao:'T2 com varanda e cozinha equipada.'}); a.discrepancias = localCoherence(a); a.coerenciaVerificada = true; a.revisado = true; a.estado = computeEstado(a);
    add('CA05','Afirmação sem suporte → coerência Pendente, Rascunho e exportação bloqueada.', a.discrepancias.length>=2 && coherenceOf(a)==='Pendente' && a.estado==='Rascunho' && exportBlockers(a,['idealista'],{certificado:'B',licenca:'1'}).length>0); }
  // CA06
  { const a = fx({caracteristicas:[feat('luz natural')], notas:'varanda', descricao:'Com varanda.'}); a.discrepancias = localCoherence(a); a.coerenciaVerificada = true; a.discrepancias.forEach(d=>d.decisao='descartada');
    add('CA06','Resolvidas todas as discrepâncias, a coerência passa a Validada.', coherenceOf(a)==='Validada'); }
  // CA07
  { const a = fx({fotos:[], caracteristicas:[]}); a.coerenciaVerificada = true; a.revisado = true; a.estado = computeEstado(a);
    add('CA07','Sem fotografias: Não aplicável, Rascunho e exportação indisponível.', coherenceOf(a)==='Não aplicável' && a.estado==='Rascunho' && exportBlockers(a,['pdf'],{}).length>0); }
  // CA08
  { const a = fx({caracteristicas:[feat('luz natural')]}); a.coerenciaVerificada = true; a.revisado = false; const antes = computeEstado(a); a.revisado = true; const depois = computeEstado(a);
    add('CA08','Só passa a Concluído com «Revi o anúncio» e coerência Validada.', antes==='Rascunho' && depois==='Concluído'); }
  // CA09
  { const a = fx({caracteristicas:[feat('luz natural')]}); a.coerenciaVerificada = true; a.revisado = true; a.estado = 'Concluído'; markEdited(a);
    add('CA09','Editar um anúncio Concluído repete a coerência e devolve-o a Rascunho.', a.estado==='Rascunho' && a.coerenciaVerificada===false && !a.revisado); }
  // CA10
  { const a = fx({caracteristicas:[feat('luz natural')], estado:'Concluído', legal:{certificado:'B',licenca:'123',isento:false}}); a.coerenciaVerificada = true; a.revisado = true;
    const antes = a.estado; a.canaisConfirmados = {}; const sem = estadoAposCanais(a); a.canaisConfirmados = {idealista:true}; const com = estadoAposCanais(a);
    add('CA10','Só a confirmação expressa do canal passa o anúncio a Publicado.', antes==='Concluído' && sem==='Concluído' && com==='Publicado', 'A caixa «Revi esta pré-visualização» desbloqueia os botões de cada canal (verifique no ecrã).'); }
  // CA11
  { const a = fx({caracteristicas:[feat('luz natural')], estado:'Concluído'}); a.coerenciaVerificada = true; a.revisado = true;
    const b = exportBlockers(a, ['idealista'], {certificado:'', licenca:'1'});
    add('CA11','Sem certificado energético a exportação para portais é bloqueada e indica o campo.', b.some(x=>/certificado/i.test(x))); }
  // CA12
  { const a = fx({caracteristicas:[feat('luz natural')], estado:'Concluído'}); a.coerenciaVerificada = true; a.revisado = true; a.canaisConfirmados = {idealista:false, instagram:true, pdf:true};
    add('CA12','Se um canal não é confirmado, os outros mantêm-se e o estado passa a Publicado.', estadoAposCanais(a)==='Publicado'); }
  // VS (UC-01 FA3)
  { const a = fx({}); const ok1 = canStage(a).ok; a.stagingTentativas = STG_MAX_TENT; const lim1 = canStage(a); a.stagingTentativas = 0; a.decoradas = Array.from({length:STG_MAX_DECORADAS}, ()=>({})); const lim2 = canStage(a); const sem = canStage(fx({fotos:[]}));
    add('VS','Virtual Staging respeita os limites de tentativas e de imagens decoradas e exige fotografias (RN05).', ok1 && !lim1.ok && !lim2.ok && !sem.ok, 'A etiqueta «Imagem decorada virtualmente» gravada na imagem e a aprovação ou descarte validam-se no ecrã.'); }
  // FA5
  { const a = fx({caracteristicas:[feat('luz natural')], titulo:'Antigo', descricao:'Texto antigo.'}); a.coerenciaVerificada = true; a.revisado = true; a.estado = 'Concluído';
    applyRegeneracao(a, {titulo:'Novo', descricao:'Texto novo.', discrepancias:[]}, {titulo:false, descricao:true});
    add('FA5','Aceitar a nova versão substitui só o campo escolhido, devolve a Rascunho e exige nova revisão.', a.titulo==='Antigo' && a.descricao==='Texto novo.' && a.estado==='Rascunho' && !a.revisado, 'A comparação lado a lado e o descarte da nova versão validam-se no ecrã.'); }
  // Reversibilidade
  { const a = fx({caracteristicas:[feat('luz natural')], titulo:'Antigo', descricao:'Texto antigo.'}); a.coerenciaVerificada = true; a.revisado = true; a.estado = 'Concluído';
    applyRegeneracao(a, {titulo:'Novo', descricao:'Texto novo.', discrepancias:[]}, {titulo:true, descricao:true}); const v = a.versaoAnterior;
    add('REV','Cada decisão tem forma de ser desfeita (coerência, staging, regeneração, canais).', !!v && v.titulo==='Antigo' && v.descricao==='Texto antigo.', 'A reabertura de cada decisão valida-se no ecrã.'); }
  // CA13
  { const a = fx({}); const r1 = failureOutcome(a,'timeout'), r2 = failureOutcome(a,'rede');
    add('CA13','Falha ou timeout da IA: Rascunho, mensagem e opções «Escrever manualmente» e «Tentar de novo», sem perder dados.', r1.estado==='Rascunho' && r1.opcoes.length===2 && /demorou/.test(r1.mensagem) && /contactar/.test(r2.mensagem) && !r1.dadosPerdidos, 'O tempo limite real de 15 s e a fila sem rede validam-se no ecrã (modo avião).'); }
  return R;
}
